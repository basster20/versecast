<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verse</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="views">
      <button class="view-pill active" data-view="scriptures">Scriptures</button>
      <button class="view-pill" data-view="themes">Themes</button>
    </div>

    <div class="transport">
      <button class="btn mic" id="sttBtn" title="Start or stop listening (M)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        <span id="sttBtnLabel">Listen</span>
      </button>
      <button class="btn live" id="liveBtn" title="Toggle live output (L)"><span class="dot"></span><span>Live</span></button>
      <button class="btn" id="blackBtn" title="Black the output (B)">Black</button>
      <button class="btn" id="clearBtn" title="Clear output and queue (C)">Clear</button>
    </div>

    <div class="rail">
      <button class="rail-btn" id="outputBtn" title="Open the projection window">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8.5 21h7M12 17.5V21"/></svg>
        <span>Output</span>
      </button>
      <button class="rail-btn" id="settingsBtn" title="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.1 14.6a1.6 1.6 0 0 0 .3 1.8l.1.1a1.9 1.9 0 1 1-2.7 2.7l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a1.9 1.9 0 1 1-3.8 0v-.2a1.6 1.6 0 0 0-2.7-1.1l-.1.1a1.9 1.9 0 1 1-2.7-2.7l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3.4a1.9 1.9 0 1 1 0-3.8h.2a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a1.9 1.9 0 1 1 2.7-2.7l.1.1a1.6 1.6 0 0 0 2.7-1.1V3.4a1.9 1.9 0 1 1 3.8 0v.2a1.6 1.6 0 0 0 2.7 1.1l.1-.1a1.9 1.9 0 1 1 2.7 2.7l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.3a1.9 1.9 0 1 1 0 3.8h-.2a1.6 1.6 0 0 0-1.4.9z"/></svg>
        <span>Settings</span>
      </button>
      <button class="rail-btn" id="helpBtn" title="Help and shortcuts">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4.9c0 1.9-2.7 2.2-2.7 3.8"/><circle cx="12" cy="17.4" r="0.9" fill="currentColor" stroke="none"/></svg>
        <span>Help</span>
      </button>
    </div>
  </header>

  <!-- ══════════ SCRIPTURES ══════════ -->
  <main class="stage" id="stage">

    <section class="panel" id="recentPanel">
      <div class="panel-head">
        <h2 class="panel-title">Recent</h2>
        <span class="spacer"></span>
        <button class="ghost-link" id="recentClear">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
          Clear all
        </button>
      </div>
      <div class="panel-body" id="recentList"></div>
    </section>

    <section class="panel" id="displayPanel">
      <div class="panel-head">
        <h2 class="panel-title">Live display</h2>
        <span class="spacer"></span>
        <button class="icon-btn" id="displayExpand" title="Open projection window">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-7.5 7.5M10 20H4v-6M4 20l7.5-7.5"/></svg>
        </button>
      </div>
      <div class="onair-body" id="displayBody"></div>
      <div class="onair-rule"></div>
      <div class="heard hidden" id="heardLine">
        <span class="heard-dot"></span>
        <span class="heard-text" id="heardText"></span>
        <span class="heard-meter" id="heardMeter" title="Microphone level">
          <span class="heard-meter-fill" id="heardLevel"></span>
        </span>
      </div>
    </section>

    <div class="rightcol">
      <section class="panel">
        <div class="output-block" style="padding-top:14px">
          <div class="output-label">
            Main output
            <span class="trailing" id="outputTranslation">KJV</span>
          </div>
          <div class="thumb" id="outputThumb"></div>
          <div class="output-nav">
            <button class="nav-sq" id="prevChapter" title="Previous chapter (←)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
            </button>
            <button class="nav-sq" id="nextChapter" title="Next chapter (→)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
            </button>
            <button class="nav-sq" id="outputOpen" style="margin-left:auto" title="Open projection window">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8.5 21h7"/></svg>
            </button>
          </div>
        </div>
      </section>

      <section class="panel" style="min-height:0">
        <div class="panel-head">
          <h2 class="panel-title">Queue</h2>
          <span class="spacer"></span>
          <button class="ghost-link" id="queueClear">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
            Clear all
          </button>
        </div>
        <div class="panel-body" id="queueList"></div>
      </section>
    </div>
  </main>

  <!-- ══════════ LOWER ══════════ -->
  <section class="lower" id="lower">

    <section class="panel browser-panel">
      <div class="searchrow">
        <div class="field" style="width:150px">
          <select class="select" id="translationSelect" aria-label="Translation">
            <option value="kjv">KJV</option>
          </select>
        </div>
        <button class="icon-btn" id="bookBtn" title="Book list" style="width:52px;height:52px;background:var(--surface-2);border-radius:10px">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M19 18v3H6.5A2.5 2.5 0 0 1 4 18.5"/></svg>
        </button>
        <button class="icon-btn" id="historyBtn" title="Back to the selected verse" style="width:52px;height:52px;background:var(--surface-2);border-radius:10px">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4M3 4v5h5"/><path d="M12 8v4.3l3 1.7"/></svg>
        </button>
        <div class="field search-field">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <input id="searchInput" type="text" autocomplete="off" spellcheck="false"
                 placeholder="Reference or phrase — e.g. John 3:16">
          <span class="hint" id="searchHint"><kbd>Tab</kbd> to search</span>
        </div>
        <button class="next-round" id="goBtn" title="Send to live (Enter)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </div>

      <div class="chapter-head" id="chapterHead"></div>
      <div class="verse-list" id="verseList"></div>
    </section>

    <section class="panel preview-panel">
      <div class="panel-head">
        <h2 class="panel-title">Preview</h2>
        <span class="spacer"></span>
        <button class="icon-btn" id="previewExpand" title="Open projection window">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-7.5 7.5M10 20H4v-6M4 20l7.5-7.5"/></svg>
        </button>
      </div>
      <div class="preview-wrap" id="previewWrap"></div>
    </section>
  </section>

  <!-- ══════════ THEMES ══════════ -->
  <section class="themes hidden" id="themesView">
    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">Themes</h2>
      </div>
      <div class="theme-list" id="themeList"></div>
    </section>

    <section class="canvas" id="themeCanvas"></section>

    <section class="panel inspector">
      <div class="insp-head">
        <span>Slide</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.8" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7L12.5 20"/></svg>
      </div>
      <div class="insp-section">
        <div class="insp-title">Background</div>
        <div class="insp-field">
          <div class="insp-label">Colour</div>
          <div class="colorfield" data-theme-color="bg"></div>
        </div>
      </div>
      <div class="insp-section">
        <div class="insp-title">Scripture</div>
        <div class="insp-field">
          <div class="insp-label">Text colour</div>
          <div class="colorfield" data-theme-color="fg"></div>
        </div>
        <div class="insp-field">
          <div class="insp-label">Size</div>
          <div class="slider">
            <input type="range" id="themeSize" min="24" max="90" step="1">
            <span class="value" id="themeSizeValue"></span>
          </div>
        </div>
        <div class="insp-field">
          <div class="insp-label">Weight</div>
          <select class="sel" id="themeWeight" style="width:100%">
            <option value="400">Regular</option>
            <option value="600">Semibold</option>
            <option value="700">Bold</option>
          </select>
        </div>
      </div>
      <div class="insp-section">
        <div class="insp-title">Reference</div>
        <div class="insp-grid">
          <div class="insp-field">
            <div class="insp-label">Gap</div>
            <div class="numfield">
              <span class="prefix">↕</span>
              <input type="number" id="themeGap" min="0" max="140" step="4">
              <span class="unit">px</span>
            </div>
          </div>
          <div class="insp-field">
            <div class="insp-label">Case</div>
            <select class="sel" id="themeCase">
              <option value="none">As written</option>
              <option value="uppercase">Uppercase</option>
            </select>
          </div>
        </div>
        <div class="row" style="padding:12px 0;border:0">
          <div class="row-main">
            <div class="row-label">Verse numbers</div>
          </div>
          <div class="toggle" id="themeNumbers"></div>
        </div>
        <div class="row" style="padding:12px 0;border:0">
          <div class="row-main">
            <div class="row-label">Text shadow</div>
          </div>
          <div class="toggle" id="themeShadow"></div>
        </div>
      </div>
    </section>
  </section>
</div>

<!-- ══════════ SETTINGS ══════════ -->
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Settings">
  <aside class="sheet-nav">
    <h2>Settings</h2>
    <button class="nav-item active" data-sheet="scripture">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M19 18v3H6.5A2.5 2.5 0 0 1 4 18.5"/></svg>
      Scripture
    </button>
    <button class="nav-item" data-sheet="translations">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h11M8 3v2c0 4-2.5 7-5 8"/><path d="M5 9c0 3 3 5.5 6 6"/><path d="m13 21 4-10 4 10"/><path d="M14.5 18h5"/></svg>
      Translations
    </button>
    <button class="nav-item" data-sheet="transcription">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      Transcription
    </button>
    <button class="nav-item" data-sheet="detection">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.6"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2.1 2.1M15.9 15.9 18 18M18 6l-2.1 2.1M8.1 15.9 6 18"/></svg>
      Detection
    </button>
    <button class="nav-item" data-sheet="output">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8.5 21h7M12 17.5V21"/></svg>
      Output
    </button>
    <button class="nav-item" data-sheet="usage">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></svg>
      Usage
    </button>
    <button class="nav-item" data-sheet="performance">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4"/><path d="M4 20h16"/><path d="m7 15 3.5-4 3 2.5L18 8"/></svg>
      Performance
    </button>
    <button class="nav-item" data-sheet="help">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4.9c0 1.9-2.7 2.2-2.7 3.8"/><circle cx="12" cy="17.4" r="0.9" fill="currentColor" stroke="none"/></svg>
      Help
    </button>
    <span class="spacer"></span>
    <div style="padding: 0 12px; color: var(--text-4); font-size: 12px;">version 1.0.0</div>
  </aside>

  <div class="sheet-main">
    <div class="sheet-head">
      <h3 id="sheetTitle">Scripture</h3>
      <span class="spacer"></span>
      <button class="icon-btn" id="sheetClose" title="Close (Esc)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/translations.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
